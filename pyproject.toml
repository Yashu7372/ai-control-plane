[project]
name="ai-control-plane"
version="0.4.0"
requires-python=">=3.11"
dependencies=[
  "PyYAML>=6.0",
  "fastapi>=0.115",
  "pydantic>=2.8",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev=["pytest>=8", "httpx>=0.27"]

[project.scripts]
ai-control-plane="apps.cli.main:main"
ai-control-plane-worker="apps.worker.main:main"

[build-system]
requires=["setuptools>=68", "wheel"]
build-backend="setuptools.build_meta"

[tool.setuptools.packages.find]
where=["."]
include=["apps*", "packages*"]
namespaces=true

[tool.pytest.ini_options]
pythonpath=["."]
testpaths=["tests"]
