name: demo-delivery
steps:
  - id: context
    type: task
    payload: {message: "Generate bounded context"}
  - id: workspace
    type: task
    depends_on: [context]
    payload: {message: "Create isolated workspace"}
  - id: approval
    type: approval
    depends_on: [workspace]
    payload: {title: "Approve implementation plan"}
  - id: implement
    type: command
    depends_on: [approval]
    payload:
      command: [python, -c, "print('implementation complete')"]
  - id: validate
    type: command
    depends_on: [implement]
    payload:
      command: [python, -c, "print('validation passed')"]
  - id: evidence
    type: evidence
    depends_on: [validate]
    payload: {kind: "validation", uri: "demo://validation/evidence.json"}
